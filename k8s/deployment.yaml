apiVersion: apps/v1
kind: Deployment
metadata:
  name: weather-app-deployment
  namespace: gtsitlaouri-priv
  labels:
    app: weather-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: weather-app
  template:
    metadata:
      labels:
        app: weather-app
    spec:
      containers:
        - name: weather-app
          image: gdtsitlauri/weather-app:latest
          imagePullPolicy: Always   # pull the newest image on every start
          ports:
            - containerPort: 3000
          env:
            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: DEPLOYMENT_NAME
              value: "weather-app-deployment"
            - name: NODE_ENV
              value: "production"
            - name: WEATHER_API_KEY          # from the Secret created as in the README
              valueFrom:
                secretKeyRef:
                  name: weather-api
                  key: api-key
